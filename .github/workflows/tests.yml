name: Vibe Guard validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scripts
        run: python -m compileall -q vibe-guard/scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
